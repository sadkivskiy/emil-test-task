name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:dry
        env:
          # Dry-run builds World and parses config, but it does not call the API.
          CLAIM_SERVICE_API_URL: https://example.com
          CLAIM_SERVICE_API_TOKEN: dry-run
      - run: npm test
        env:
          CLAIM_SERVICE_API_URL: ${{ secrets.CLAIM_SERVICE_API_URL }}
          CLAIM_SERVICE_API_TOKEN: ${{ secrets.CLAIM_SERVICE_API_TOKEN }}
